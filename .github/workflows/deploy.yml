name: CI/CD AgenteCoff

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente al hacer push a la rama main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets::DOCKER_USERNAME }}
          password: ${{ secrets::DOCKER_PASSWORD }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construye y sube la API
      - name: Construir y subir imagen de la API
        uses: docker/build-push-action@v5
        with:
          context: ./AgenteCoff.ApiService # Ajusta si la ruta en tu repo varía
          file: ./AgenteCoff.ApiService/Dockerfile
          push: true
          tags: ${{ secrets::DOCKER_USERNAME }}/agentecoff-api:latest

      # Construye y sube el Frontend
      - name: Construir y subir imagen del WebFrontend
        uses: docker/build-push-action@v5
        with:
          context: ./AgenteCoff.Web # Ajusta si la ruta en tu repo varía
          file: ./AgenteCoff.Web/Dockerfile
          push: true
          tags: ${{ secrets::DOCKER_USERNAME }}/agentecoff-web:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en el servidor de DonWeb vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets::SSH_HOST }}
          username: ${{ secrets::SSH_USER }}
          password: ${{ secrets::SSH_PASSWORD }}
          script: |
            cd ~/docker/agentecoff
            docker compose pull
            docker compose up -d --remove-orphans

name: CI/CD AgenteCoff

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Configuramos .NET SDK en el servidor de GitHub
      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0' # Ajusta a tu versión de .NET (ej. '8.0' o '9.0')

      # Iniciamos sesión en Docker Hub usando el comando nativo de Docker
      - name: Iniciar sesión en Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Compilar, empaquetar y subir la API usando Docker
      - name: Publicar y subir API Service
        run: |
          dotnet publish ./AgenteCoff.ApiService/AgenteCoff.ApiService.csproj -c Release /t:PublishContainer -p:ContainerRepository=agentecoff-api -p:ContainerRuntimeIdentifier=linux-x64
          docker tag agentecoff-api:latest ${{ secrets.DOCKER_USERNAME }}/agentecoff-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/agentecoff-api:latest

      # Compilar, empaquetar y subir el WebFrontend usando Docker
      - name: Publicar y subir Web Frontend
        run: |
          dotnet publish ./AgenteCoff.Web/AgenteCoff.Web.csproj -c Release /t:PublishContainer -p:ContainerRepository=agentecoff-web -p:ContainerRuntimeIdentifier=linux-x64
          docker tag agentecoff-web:latest ${{ secrets.DOCKER_USERNAME }}/agentecoff-web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/agentecoff-web:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en el servidor de DonWeb vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/docker/agentecoff
            docker compose pull
            docker compose up -d --remove-orphans

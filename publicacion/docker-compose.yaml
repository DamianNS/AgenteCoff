services:
  mi-red-hogarena-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888:18888"   # Interfaz web para vos
      - "18889:18889"   # gRPC para que tus apps le manden la telemetría (¡FALTABA ESTE!)
      - "18890:18890"   # HTTP opcional para telemetría
    networks:
      - "aspire"
    restart: "always"
    environment:
      - DASHBOARD__OTLP__AUTHMODE=ApiKey
      - DASHBOARD__OTLP__PRIMARYAPIKEY=HolaMundo
  apiservice:
    build:
      context: ../AgenteCoff.ApiService  # Ruta hacia la carpeta de tu API
      dockerfile: Dockerfile
    image: agentecoff-api:latest
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${APISERVICE_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://mi-red-hogarena-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "apiservice"
      OTEL_EXPORTER_OTLP_HEADERS: "x-otlp-api-key=HolaMundo"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/agentecoff.db"
    expose:
      - "5001"
    networks:
      - "aspire"
    volumes:
      - ./datos_api:/app/data
  webfrontend:
    build:
      context: ../AgenteCoff.Web  # Ruta hacia la carpeta de tu frontend
      dockerfile: Dockerfile
    image: agentecoff-web:latest
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${WEBFRONTEND_PORT}"
      APISERVICE_HTTP: "http://apiservice:5001"
      services__apiservice__http__0: "http://apiservice:5001"
      APISERVICE_HTTPS: "https://apiservice:5001"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://mi-red-hogarena-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "webfrontend"
      OTEL_EXPORTER_OTLP_HEADERS: "x-otlp-api-key=HolaMundo"
    ports:
      - "8080:8080"
    depends_on:
      apiservice:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
